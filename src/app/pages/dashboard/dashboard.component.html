<div class="dashboard-container">
  <header class="dashboard-header">
    <h1>Pedidos360</h1>
    <div class="user-info">
      <span>{{ username() }}</span>
      @if (isAdmin()) {
        <span class="role-badge admin">Admin</span>
      } @else {
        <span class="role-badge user">User</span>
      }
      <button type="button" (click)="signOut()">Cerrar sesión</button>
    </div>
  </header>

  <section class="dashboard-content">
    <h2>Bienvenido, {{ username() }}</h2>

    <div class="cards">
      <div class="card" (click)="irAPedidos()">
        <h3>Mis Pedidos</h3>
        <p>Ver y crear tus pedidos.</p>
      </div>

      @if (isAdmin()) {
        <div class="card admin-card" (click)="irAAdmin()">
          <h3>Panel Admin</h3>
          <p>Gestionar todos los pedidos del sistema.</p>
        </div>
      }
    </div>
  </section>
</div>
